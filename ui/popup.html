<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
  <title>SilverFoxBlocker</title>
</head>
<body>
  <div class="app">
    <header class="head sf-rise" style="--d:0">
      <div class="brand">
        <img class="logo" src="../icons/icon128.png" alt="SilverFoxBlocker">
        <div>
          <div class="name">SilverFoxBlocker</div>
          <div class="sub">拦截银狐木马投放站点</div>
        </div>
      </div>
      <span class="pill" id="globalPill">防护中</span>
    </header>

    <div class="card sf-rise site-card" id="siteCard" style="--d:1">
      <div class="site-row">
        <div class="site-id">
          <div class="site-host" id="siteHost">—</div>
          <div class="site-label">当前网站风险评分</div>
        </div>
        <div class="site-badge">
          <div class="site-score" id="siteScore">—</div>
          <div class="site-level lvl-unknown" id="siteLevel">未知</div>
        </div>
      </div>
      <div class="site-reasons" id="siteReasons"></div>
    </div>
    <div class="card sf-rise" id="statCard" style="--d:2">
      <div class="stats">
        <div class="stat"><div class="num" id="ppWarn">0</div><div class="cap">拦截风险网站</div></div>
        <div class="stat"><div class="num" id="ppBlock">0</div><div class="cap">拦截下载</div></div>
      </div>
      <div class="recent">
        <div class="sec-title">最近拦截的风险域名</div>
        <ul class="recent-list" id="ppRecent"></ul>
        <div class="recent-empty" id="ppRecentEmpty">暂无拦截记录</div>
      </div>
      <a class="recent-more" id="ppMore">查看完整防护统计→</a>
    </div>
    <button class="settings-btn sf-rise" id="openSettings" style="--d:3">打开控制面板</button>
    <button class="report-btn sf-rise" id="openReport" style="--d:4">一键上报网站</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
