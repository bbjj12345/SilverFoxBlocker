name = "silverfoxblocker"
main = "worker/index.js"
compatibility_date = "2026-11-02"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "6d141838347d4cfc86083a479231bf02"

[[kv_namespaces]]
binding = "FEEDBACK"
id = "98ac1246bc7746368baf6a071f9fed9f"

# 名单存活巡检（HTTP 探测 + DNS / 注册局佐证）的结果存储 —— 与 FEEDBACK 分开：
#   FEEDBACK 存「用户反馈/按天限流」，生命周期一天；这里存「域名存活状态/游标/引导表缓存」，
#   生命周期以月计。混在同一个命名空间里，清理限流数据时容易连带清掉巡检游标。
#
# 启用步骤（不建也能跑，只是结果只进日志）：
#   npx wrangler kv namespace create HEALTH
#   → 把输出的 id 填到下面，取消这两行注释，再 npx wrangler deploy
[[kv_namespaces]]
binding = "HEALTH"
id = "112de06669d341c5acad07e950411df3"

# ============================================================================
# /list 的 5 分钟缓存（v1.13.15）放在哪个 KV？
#   默认复用上面的 HEALTH —— **不用新建、不用改配置**，deploy 后就生效。
#   想让它与巡检结果分开（清理巡检数据时不连带影响名单缓存），再建一个：
#       npx wrangler kv namespace create LIST_CACHE
#   然后取消下面三行注释并填 id（代码会自动优先用 LIST_CACHE，其次 HEALTH）：
# [[kv_namespaces]]
# binding = "LIST_CACHE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
#   两个都没绑时：缓存自动关闭，/list 行为与 v1.13.14 完全一致（不会报错）。
# ============================================================================

[vars]
GITEE_OWNER = "bbjj12345"
GITEE_REPO = "silver-fox-blocker-cloud"
# ============================================================================
# ⚠️ 反馈接口的签名密钥 **不要** 写在这里（v1.13.11 起）
#   POST 反馈现在只认 HMAC-SHA256 签名，密钥放在 Cloudflare Secret 里：
#       npx wrangler secret put SECRET_DATA --name silverfoxblocker
#   为什么不写进 [vars]：这个文件会进仓库，写进来等于把密钥连同仓库一起公开；
#   Secret 只在 Worker 运行时可见，也不会出现在 `wrangler deploy` 的差异里。
#   没配 SECRET_DATA 时接口以 503 关闭（FEEDBACK_DISABLED），属预期行为。
#   两端必须一致：扩展端在 ui/feedback-config.js 的 secretCodes（字符码数组）。
# ============================================================================
# ============================================================================
# 人机验证（Cloudflare Turnstile，v1.13.12 起）
#   TURNSTILE_SITE_KEY  公开值，写在这里没问题（它会出现在发给浏览器的挑战页 HTML 里）。
#   TURNSTILE_SECRET_KEY 必须用 Secret：
#       npx wrangler secret put TURNSTILE_SECRET_KEY --name silverfoxblocker
#   两者都配才生效；只配 secret 不配 site key → 挑战页明确报错（不会静默放行）。
#   都不配 → 接口退回「只验 HMAC 签名」，与 v1.13.11 行为一致，老部署直接升级不受影响。
#   注意：这个 site key 必须是「给 api.silverfoxblocker.dpdns.org 用」的那个 widget，
#   Turnstile 后台可以限制 hostname；限制错了会显示 invalid-hostname。
# ============================================================================
#   TURNSTILE_ENFORCE    soft（默认）| strict —— 决定「验证没过」是否还能发：
#       soft  ：过了 = 60 次/天；没过（框出不来 / 凭据过期 / 服务端故障）= 仍放行，但只有 3 次/天
#       strict：没过就不让发（v1.13.12 的老行为，会把网络打不开验证组件的用户彻底挡在门外）
#   TURNSTILE_SOFT_QUOTA 降级通道的每日上限，默认 3，上限 60（写大了会被夹到 60）
#   两个都不写就是 soft + 3，通常不需要写。
# TURNSTILE_ENFORCE = "soft"
# TURNSTILE_SOFT_QUOTA = "3"
# 旧：一行被注释掉的占位，容易被误以为已配置 —— 2026-11-27 取消注释，真实生效。
TURNSTILE_SITE_KEY = "0x4AAAAAAGVz3ovQlQiJuifk"

# 巡检结果邮件的收件人（可选）。
# 默认发到 feedback@silverfoxblocker.dpdns.org，再由 Cloudflare Email Routing 转发到
# 你真正的邮箱 —— 私人地址不必写进代码或仓库，换邮箱只改面板里的路由规则。
# 想和用户反馈分箱：在 Email Routing 里新建 health@silverfoxblocker.dpdns.org 的转发规则，
# 然后取消下面这行注释（不改代码，重新部署一次即可）。
# HEALTH_MAIL_TO = "health@silverfoxblocker.dpdns.org"
# CORS 白名单：2026-11-27 起 Worker 代码默认放行「任意扩展来源」（chrome-extension://*），
# 所以换解压路径 / 换电脑都不必再动这里 —— 这一行平时保持注释即可。
# 需要额外放行某个网页来源（极少见）或补充固定 Origin 时才取消注释：
#   ALLOWED_ORIGINS = "https://*.example.com,chrome-extension://xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
# 支持通配符 *（匹配任意长度，含空）：`chrome-extension://*` 全部扩展、`https://*.example.com` 任意子域
#   （注意 `*.example.com` 不含 example.com 本身，需要就另写一条）。
# 只有 * 是通配，`.` `+` 等按字面匹配，不会把白名单放成筛子。
# 想回到「只认固定 ID」的严格模式：把 worker/index.js 里的 ALLOW_ANY_EXTENSION 改成 false。
# ⚠️ 只能写在当前这个 [vars] 段里：TOML 不允许出现第二个 [vars] 表，重复会直接部署失败。
# ALLOWED_ORIGINS = "chrome-extension://xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

[observability.logs]
enabled = true
invocation_logs = true

[triggers]
# 每天 03:00 UTC（北京时间 11:00）跑一次名单存活巡检。
# 注意 Cron 用 UTC：写成 "0 3 * * *" 就是北京时间 11:00，不是凌晨 3 点。
crons = ["0 3 * * *"]
